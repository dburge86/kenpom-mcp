[project]
name = "kenpom-mcp"
version = "0.2.0"
description = "MCP server for KenPom basketball analytics with Cloudflare Workers support"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[dependency-groups]
dev = [
    "workers-py>=1.6.0",
    "workers-runtime-sdk",
    "pytest>=8.0.0",
]

[project.scripts]
kenpom-mcp = "kenpom_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenpom_mcp"]
